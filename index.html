<style>
:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:#d9e6de;color:var(--ink);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(9,68,47,.18);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.bar{position:sticky;top:0;z-index:20;background:var(--leaf);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px}
.bar .mark{width:42px;height:42px;border-radius:13px;background:var(--gold);color:var(--leaf-d);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:24px;flex:none}

.bar small{display:block;font-size:12.5px;opacity:.82;font-weight:500}
.find{position:sticky;top:calc(66px + env(safe-area-inset-top,0px));z-index:19;background:var(--bg);padding:10px 16px 8px}
.find input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px 0 42px;font-size:15px}

.pad{padding:6px 16px 0}

.how ol{list-style:none;display:grid;gap:8px;margin-top:2px}
.how li{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.how li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.how p{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--leaf-d)}
.how p+p{margin-top:4px}
.win{display:flex;gap:10px;align-items:center;background:var(--leaf-l);color:var(--leaf-d);border-radius:14px;padding:11px 12px;margin-top:12px;font-size:13.5px;font-weight:700;line-height:1.35}
.win span{font-size:20px}

/* ---- category tiles ---- */
.h2{font-family:var(--head);font-size:19px;font-weight:800;margin:20px 0 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;background:var(--tint,#fff);border-radius:20px;padding:14px 14px 12px;min-height:138px;display:flex;flex-direction:column;border:2px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .em{font-size:40px;line-height:1.1}
.tile b{font-family:var(--head);font-size:17.5px;font-weight:800;margin-top:auto;line-height:1.2}
.tile small{font-size:12px;color:var(--muted);font-weight:500}
.tile .cnt{font-size:11.5px;font-weight:700;color:var(--leaf-d);margin-top:3px}
.tile .got{position:absolute;top:10px;right:10px;background:var(--leaf);color:#fff;border-radius:11px;min-width:24px;height:24px;padding:0 8px;font-size:12.5px;font-weight:700;display:grid;place-items:center}
.tile.has{border-color:var(--leaf)}

/* ---- item rows ---- */
.group{font-family:var(--head);font-weight:800;font-size:15px;margin:16px 0 6px;color:var(--leaf-d)}
.rows{background:var(--card);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;flex:none;background:var(--tint,#eef)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row .nm small{font-size:12px;color:var(--muted)}
.add{min-width:74px;height:36px;border-radius:11px;border:1.5px solid var(--leaf);color:var(--leaf);font-weight:700;font-size:14px;background:#fff}
.step{display:flex;align-items:center;height:36px;border-radius:11px;background:var(--leaf);color:#fff;flex:none}
.step button{width:34px;height:36px;font-size:20px;font-weight:700;color:#fff}

.none{padding:46px 12px;text-align:center;color:var(--muted)}

footer{padding:26px 16px 8px;text-align:center;font-size:12.5px;color:var(--muted)}
footer a{color:var(--leaf);font-weight:700}

.rcat{font-family:var(--head);font-weight:800;font-size:14px;color:var(--leaf-d);margin:10px 0 2px}
.rcat:first-child{margin-top:0}
.fld{display:block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  ["அஜ்வா பேரீச்சை","Ajwa dates","g250"],["மப்ரூம் பேரீச்சை","Mabroom dates","g250"],["சுக்கரி பேரீச்சை","Sukkari dates","g250"],
  ["கலமி பேரீச்சை","Kalmi dates","g250"],["மெட்ஜூல் பேரீச்சை","Medjool dates","g250"],["குத்ரி பேரீச்சை","Khudri dates","g250"],
  ["சஃபாவி பேரீச்சை","Safawi dates","g250"],["கொட்டை நீக்கிய பேரீச்சை","Seedless dates","g250"],["சாதாரண பேரீச்சம்பழம்","Regular dates","g250"]
 ],
 grocery:[
  ["சர்க்கரை","Sugar","kg1","🍚"],["வெல்லம்","Jaggery","kgh"],["உப்பு","Salt","kg1","🧂"],["கோதுமை மாவு","Wheat flour (Atta)","kg1"],
  ["மைதா","Maida","kg1"],["ரவை","Rava (Sooji)","kg1"],["கடலை மாவு","Besan","kgh"],["சேமியா","Vermicelli","g250"],
  ["டீ தூள்","Tea powder","g250","🍵"],["காபி தூள்","Coffee powder","g250","☕"],["கடலை எண்ணெய்","Groundnut oil","ml","🛢️"],
  ["நல்லெண்ணெய்","Gingelly oil","ml","🛢️"],["தேங்காய் எண்ணெய்","Coconut oil","ml","🥥"],["சூரியகாந்தி எண்ணெய்","Sunflower oil","ml","🛢️"],
  ["நெய்","Ghee","ml5","🧈"],["பால் பவுடர்","Milk powder","g250","🥛"],["பிஸ்கட்","Biscuits","pkt","🍪"],["ஊறுகாய்","Pickle","pkt"]
 ]
};

/* ================= DATA SETUP ================= */
const $ = s => document.querySelector(s);
const catById = {}; CATS.forEach(c=>catById[c[0]]=c);
const ITEMS = []; const byId = {};
CATS.forEach(c=>{
  (RAW[c[0]]||[]).forEach(r=>{
    const it={id:c[0]+"_"+r[1].toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),cat:c[0],ta:r[0],en:r[1],unit:UNITS[r[2]],emoji:r[3]||c[3]};
    ITEMS.push(it); byId[it.id]=it;
  });
});

/* ================= STATE ================= */
let cart = {};            // item id -> quantity (grams / ml / count)
let details = {name:"",phone:"",addr:"",note:""};
let cameFromHome = false;
try{
  const s=JSON.parse(localStorage.getItem("bps_order")||"{}");
  if(s.cart){ for(const k in s.cart){ if(byId[k]) cart[k]=s.cart[k]; } }
  if(s.details) details=Object.assign(details,s.details);
}catch(e){}
function save(){ try{ localStorage.setItem("bps_order",JSON.stringify({cart,details})); }catch(e){} }

/* ================= HELPERS ================= */
function trimNum(n){ return String(Math.round(n*100)/100).replace(/\.0+$/,""); }
function fmt(q,u){
  if(u==="g")  return q>=1000 ? trimNum(q/1000)+" kg" : q+" g";
  if(u==="ml") return q>=1000 ? trimNum(q/1000)+" L"  : q+" ml";
  if(u==="pc") return q+(q===1?" pc":" pcs");
  return q+" "+u;
}
const itemCount = () => Object.keys(cart).length;
function curCat(){ const h=location.hash.slice(1); return catById[h]||null; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2200); }

/* ================= RENDER ================= */
function ctl(it){
  const q=cart[it.id];
  return q
   ? `<div class="step"><button data-act="dec" aria-label="Decrease ${it.en}">−</button><span>${fmt(q,it.unit.u)}</span><button data-act="inc" aria-label="Increase ${it.en}">+</button></div>`
   : `<button class="add" data-act="inc" aria-label="Add ${it.en}">ADD</button>`;
}
function row(it){
  return `<div class="row" data-id="${it.id}" style="--tint:${catById[it.cat][4]}">
    <span class="ico" aria-hidden="true">${it.emoji}</span>
    <div class="nm"><b>${it.ta}</b><small>${it.en}</small></div>
    <div data-ctl>${ctl(it)}</div></div>`;
}
function renderBar(){
  const c=curCat();
  $("#bar").innerHTML = c
    ? `<button class="back" id="back" aria-label="Back to categories">←</button><div><h1>${c[1]}</h1><small>${c[2]}</small></div>`
    : `<div class="mark" aria-hidden="true">ப</div><div><h1>${STORE_NAME}</h1><small>WhatsApp order | ECR &amp; OMR delivery</small></div>`;
  $("#q").placeholder = c ? `${c[1]} பகுதியில் தேடு` : "எல்லா பொருட்களிலும் தேடு (Search)";
}
function renderView(){
  const c=curCat(), q=$("#q").value.trim().toLowerCase();
  const match = it => !q || (it.ta+" "+it.en).toLowerCase().includes(q);
  let html="";
  if(c){
    const list=ITEMS.filter(it=>it.cat===c[0] && match(it));
    html = list.length ? `<div class="rows" style="margin-top:6px">${list.map(row).join("")}</div>`
                       : `<div class="none"><b>🔎</b>பொருள் கிடைக்கவில்லை<br>No item found</div>`;
  } else if(q){
    const parts=CATS.map(cc=>{
      const list=ITEMS.filter(it=>it.cat===cc[0] && match(it));
      return list.length ? `<div class="group">${cc[3]} ${cc[1]}</div><div class="rows">${list.map(row).join("")}</div>` : "";
    }).join("");
    html = parts || `<div class="none"><b>🔎</b>பொருள் கிடைக்கவில்லை<br>No item found</div>`;
  } else {
    html = `<div class="how"><ol>
        <li><i>1</i>வகையைத் தேர்வு செய்யுங்கள்</li>
        <li><i>2</i>பொருளை ADD செய்து அளவு வையுங்கள்</li>
        <li><i>3</i>WhatsApp-ல் ஆர்டர் அனுப்புங்கள்</li></ol>
        <p>🛵 ECR &amp; OMR பகுதிகளுக்கு மட்டும் டோர் டெலிவரி</p>
        <p>⏱️ ${WINDOW_TA} டெலிவரி</p></div>
      <h2 class="h2">என்ன வேண்டும்?</h2>
      <div class="tiles">${CATS.map(cc=>{
        const total=ITEMS.filter(it=>it.cat===cc[0]).length;
        const got=ITEMS.filter(it=>it.cat===cc[0] && cart[it.id]).length;
        return `<button class="tile ${got?'has':''}" data-cat="${cc[0]}" style="--tint:${cc[4]}">
          <span class="em" aria-hidden="true">${cc[3]}</span>
          ${got?`<span class="got" aria-label="${got} selected">${got}</span>`:""}
          <b>${cc[1]}</b><small>${cc[2]}</small><span class="cnt">${total} பொருட்கள்</span></button>`;}).join("")}</div>`;
  }
  $("#view").innerHTML=html;
}
function renderDock(){
  const n=itemCount();
  $("#dock").classList.toggle("show",n>0);
  $("#dockN").textContent=n;
  $("#dockT").textContent = n===1 ? "பொருள் தேர்வு" : "பொருட்கள் தேர்வு";
}
function renderAll(scroll){
  renderBar(); renderView(); renderDock();
  if(scroll) window.scrollTo(0,0);
}

/* ================= CART ACTIONS ================= */
function change(id,dir){
  const it=byId[id], q=cart[id];
  if(dir>0){ cart[id] = q ? q+it.unit.step : it.unit.start; if(it.unit.u==="pc"&&cart[id]>99) cart[id]=99; }
  else { const nq=q-it.unit.step; if(nq<=0) delete cart[id]; else cart[id]=nq; }
  save();
  document.querySelectorAll(`.row[data-id="${id}"] [data-ctl]`).forEach(el=>el.innerHTML=ctl(it));
  renderDock();
  if($("#sheet").classList.contains("on")) renderReviewList();
}

/* ================= REVIEW SHEET ================= */
function grouped(){
  return CATS.map(c=>({c, list:ITEMS.filter(it=>it.cat===c[0] && cart[it.id])})).filter(g=>g.list.length);
}
function renderReviewList(){
  const g=grouped(), el=$("#revList");
  if(!el) return;
  if(!g.length){ closeSheet(); return; }
  el.innerHTML = g.map(x=>`<div class="rcat">${x.c[3]} ${x.c[1]}</div>`+x.list.map(it=>`
    <div class="rline" data-id="${it.id}"><div class="nm">${it.ta}<small>${it.en}</small></div>
      <div class="step"><button data-act="dec" aria-label="Decrease ${it.en}">−</button><span>${fmt(cart[it.id],it.unit.u)}</span><button data-act="inc" aria-label="Increase ${it.en}">+</button></div></div>`).join("")).join("");
  $("#revSub").textContent = itemCount()+(itemCount()===1?" item":" items");
}
function openReview(){
  $("#sheetBody").innerHTML=`
    <h2>உங்கள் ஆர்டர்</h2><p class="sub" id="revSub"></p>
    <div class="box" id="revList"></div>
    <div class="win"><span aria-hidden="true">⏱️</span><div>டெலிவரி: ${WINDOW_TA}<br><small style="font-weight:500">Delivery ${WINDOW_EN}</small></div></div>
    <div class="box"><h3>டெலிவரி விவரம்</h3>
      <label class="fld" id="fName">பெயர் (Name)<input id="iName" autocomplete="name"><span class="err">பெயரை உள்ளிடவும்</span></label>
      <label class="fld" id="fPhone">மொபைல் எண் (Mobile)<input id="iPhone" inputmode="numeric" maxlength="10" autocomplete="tel"><span class="err">சரியான 10 இலக்க எண்ணை உள்ளிடவும்</span></label>
      <label class="fld" id="fAddr">முகவரி (Address, ECR / OMR)<textarea id="iAddr" placeholder="வீட்டு எண், தெரு, பகுதி"></textarea><span class="err">முகவரியை உள்ளிடவும்</span></label>
      <label class="fld">குறிப்பு (Note, optional)<input id="iNote" placeholder="எ.கா. பல்லாரி சிறியதாக வேண்டும்"></label>
    </div>
    <button class="cta" id="send">WhatsApp-ல் ஆர்டர் அனுப்பு</button>
    <button class="cta ghost" id="clearAll">எல்லாவற்றையும் நீக்கு (Clear)</button>`;
  $("#iName").value=details.name; $("#iPhone").value=details.phone; $("#iAddr").value=details.addr; $("#iNote").value=details.note;
  renderReviewList();
  $("#veil").classList.add("on"); $("#sheet").classList.add("on"); document.documentElement.classList.add("lock");
}
function closeSheet(){
  $("#veil").classList.remove("on"); $("#sheet").classList.remove("on"); document.documentElement.classList.remove("lock");
}

/* ================= WHATSAPP MESSAGE ================= */
function buildMessage(){
  const now=new Date();
  const when=now.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
  const out=[`*${STORE_NAME} - புதிய ஆர்டர்*`,when,""];
  grouped().forEach(g=>{
    out.push(`*${g.c[3]} ${g.c[1]} (${g.c[2]})*`);
    g.list.forEach((it,i)=>out.push(`${i+1}. ${it.ta} (${it.en}) - ${fmt(cart[it.id],it.unit.u)}`));
    out.push("");
  });
  out.push(`மொத்தம்: ${itemCount()} பொருட்கள்`,"");
  out.push(`பெயர்: ${details.name}`,`மொபைல்: ${details.phone}`,`முகவரி: ${details.addr}`,`டெலிவரி: ${WINDOW_TA} (Delivery ${WINDOW_EN})`);
  if(details.note) out.push(`குறிப்பு: ${details.note}`);
  return out.join("\n");
}
function validate(){
  const n=$("#iName").value.trim(), p=$("#iPhone").value.trim(), a=$("#iAddr").value.trim();
  const rules=[["fName",n.length>1],["fPhone",/^[6-9]\d{9}$/.test(p)],["fAddr",a.length>5]];
  rules.forEach(([id,ok])=>document.getElementById(id).classList.toggle("bad",!ok));
  if(!rules.every(r=>r[1])) return false;
  details={name:n,phone:p,addr:a,note:$("#iNote").value.trim()}; save();
  return true;
}
function sendOrder(){
  if(!validate()){ toast("விவரங்களை சரி பார்க்கவும்"); return; }
  const msg=buildMessage();
  const url="https://wa.me/"+STORE_WHATSAPP+"?text="+encodeURIComponent(msg);
  $("#sheetBody").innerHTML=`<div class="ok"><div class="tick">✓</div>
    <h2 style="padding:0">ஆர்டர் தயார்</h2>
    <p class="sub">WhatsApp திறக்கும். அங்கு <b>Send</b> அழுத்தினால் ஆர்டர் கடைக்கு சென்றுவிடும்.<br>திறக்கவில்லை என்றால் கீழே உள்ள பச்சை பட்டனை அழுத்தவும்.<br>${WINDOW_TA} டெலிவரி செய்யப்படும்.</p>
    <a class="cta" href="${url}" target="_blank" rel="noopener">WhatsApp-ஐ திற</a>
    <pre id="sum"></pre>
    <button class="cta ghost" id="copySum">Copy order text</button>
    <button class="cta ghost" id="newOrder">புதிய ஆர்டர் (New order)</button></div>`;
  $("#sum").textContent=msg;
  const w=window.open(url,"_blank");
  if(!w) location.href=url;
}

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t) return;
  if(t.dataset.act){ const holder=t.closest("[data-id]"); if(holder) change(holder.dataset.id,t.dataset.act==="inc"?1:-1); return; }
  if(t.dataset.cat){ cameFromHome=true; $("#q").value=""; location.hash=t.dataset.cat; return; }
  if(t.id==="back"){ $("#q").value=""; if(cameFromHome && history.length>1) history.back(); else location.hash=""; return; }
  if(t.id==="openReview"){ openReview(); return; }
  if(t.id==="send"){ sendOrder(); return; }
  if(t.id==="clearAll"){ cart={}; save(); closeSheet(); renderAll(); toast("ஆர்டர் நீக்கப்பட்டது"); return; }
  if(t.id==="newOrder"){ cart={}; save(); closeSheet(); renderAll(true); return; }
  if(t.id==="copySum"){ (navigator.clipboard?navigator.clipboard.writeText($("#sum").textContent):Promise.reject()).then(()=>toast("Copied"),()=>toast("Select the text and copy")); return; }
  if(t.hasAttribute("data-close")) closeSheet();
});
$("#veil").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
$("#q").addEventListener("input",renderView);
window.addEventListener("hashchange",()=>{ $("#q").value=""; renderAll(true); });

/* ================= START ================= */
renderAll();
</script>
</body>
</html>
